server {
    listen 80;
    listen [::]:80;
    server_name forge.stelioszach.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/forgerl-acme; }
    location / { return 308 https://forge.stelioszach.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge.stelioszach.com;
    ssl_certificate /etc/letsencrypt/live/forge.stelioszach.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.stelioszach.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ForgeRL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        client_max_body_size 4k;
        limit_req zone=forgerl_api burst=24 nodelay;
        limit_req_status 429;
        limit_conn forgerl_connections 12;
        proxy_pass http://127.0.0.1:18406/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header Server;
        access_log off;
    }
}
