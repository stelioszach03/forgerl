name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-sandbox:
    name: Python and isolated execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORGERL_RUN_DOCKER_TESTS: "1"
      FORGERL_SANDBOX_IMAGE: forgerl-sandbox:v1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Build isolated test runner
        run: docker build --pull -t forgerl-sandbox:v1 sandbox
      - name: Run unit and real Docker integration checks
        run: python -m pytest -q
      - name: Check research CLI without starting inference
        run: python scripts/research_run.py

  frontend:
    name: Browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify browser behavior with offline fixtures
        run: npm run test:frontend
