[project]
name = "forgerl"
version = "0.2.0"
description = "Evidence-driven adaptive compute for bounded coding repair agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgerl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
